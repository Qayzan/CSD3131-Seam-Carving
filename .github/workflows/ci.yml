name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux (g++) and Windows (MSVC, the compiler the team uses locally).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

  web:
    # The interactive browser demo (web/): the same C++ library compiled to
    # WebAssembly with Emscripten. The finished site is kept as a downloadable
    # artifact of every run ("seam-carving-web"); on main it is also deployed to
    # Netlify when the repository has the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID
    # secrets (Settings > Secrets and variables > Actions).
    name: Build web demo (WebAssembly)
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Build
        run: |
          emcmake cmake -S web -B build-web
          cmake --build build-web
          test -s build-web/site/seam_carving.js
          test -s build-web/site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: seam-carving-web
          path: build-web/site

      - name: Deploy to Netlify (main only, if configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@17 deploy --dir build-web/site --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
